apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: study-buddy-hpa
  namespace: streamlit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: study-buddy-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
